#!/usr/sbin/nft -f
# ESP-Music 服务器主机防火墙（Debian/nftables）
#
# 入站默认拒绝。放行：
#   · 内网 WiFi 段 192.168.0.0/24 与本机 IPv6 前缀 → SSH / ESP 契约层(3210)
#     / qqweb(3211) / Navidrome(4533) / usblinkd(8888)
#   · Tailscale 虚拟网卡 tailscale0 全部放行（手机/电脑走 tailnet 访问）
#   · ICMPv6 / DHCPv6（没有它 IPv6 会半死不活）
#
# 说明：
#   · 公网 IPv4：家宽无公网 IP，路由器不做端口映射
#   · 公网 IPv6：不开放入站（曾做过直连测试，已关闭）
#   · 公网访问走 Cloudflare Tunnel：映射设备在内网，命中 LAN 规则
#
# 安装：cp 到 /etc/nftables.conf && systemctl enable --now nftables
# 注意：改本文件前先挂个自动回滚保险，别把自己 SSH 锁在外面。
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        iif "lo" accept
        # Tailscale 虚拟网卡：tailnet 内设备访问服务器就走这里
        iif "tailscale0" accept

        # ICMPv6 不能全禁：邻居发现(NDP)、路径 MTU 都靠它
        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, \
                      parameter-problem, echo-request, \
                      nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, \
                      nd-router-solicit } accept
        udp dport 546 accept              # DHCPv6 客户端
        udp dport 41641 accept            # Tailscale 直连打洞

        # SSH：只允许内网
        ip  saddr 192.168.0.0/24           tcp dport 22 accept
        ip6 saddr fe80::/10                tcp dport 22 accept
        ip6 saddr 2409:8a28:2ed9:f171::/64 tcp dport 22 accept

        # 内网服务
        ip  saddr 192.168.0.0/24           tcp dport { 3210, 3211, 4533, 8888 } accept
        ip6 saddr fe80::/10                tcp dport { 3210, 3211, 4533, 8888 } accept
        ip6 saddr 2409:8a28:2ed9:f171::/64 tcp dport { 3210, 3211, 4533, 8888 } accept

        udp dport 123 accept              # NTP
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
