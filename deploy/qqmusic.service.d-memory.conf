# 服务器端播放器（mpv 子进程）让本服务比"只做 QQ 契约层"时多吃 ~50MB。
# 原值 MemoryHigh=120M / MemoryMax=150M 是 2026-10-12 定的，那时还没有播放能力
# （实测峰值 68M）。加了 mpv 之后常态 anon 72M + 页缓存 40M = 119M，
# memory.events 里 high 已被顶 76 次（一直在限流）。
# 新值：High 160M 给正常播放留余量；Max 200M 仍是硬上限，
# 最坏情况只杀本服务，还能给系统（sshd/热点）留 ~176MB。
[Service]
MemoryHigh=160M
MemoryMax=200M
