<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>QQ 音乐</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- 登录 -->
<div id="login" class="login hidden">
  <div class="login-box">
    <div class="login-logo">QQ 音乐</div>
    <div class="login-sub">Navidrome 风格 · 网页播放器</div>
    <form id="login-form">
      <input id="login-user" name="user" placeholder="账号" autocomplete="username" autocapitalize="off" spellcheck="false">
      <input id="login-pass" name="password" type="password" placeholder="密码" autocomplete="current-password">
      <button type="submit" id="login-btn">登录</button>
    </form>
    <div id="login-err" class="login-err"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="app" class="app hidden">
  <header class="top">
    <div class="brand">QQ 音乐</div>
    <nav class="tabs">
      <button class="tab active" data-tab="playlists">歌单</button>
      <button class="tab" data-tab="search">搜索</button>
    </nav>
    <button id="btn-logout" class="ghost">退出</button>
  </header>

  <main id="main">
    <section id="view-playlists" class="view">
      <div id="playlists" class="cards"></div>
    </section>

    <section id="view-songs" class="view hidden">
      <div class="subbar">
        <button id="btn-back" class="ghost">← 返回</button>
        <h2 id="songs-title"></h2>
      </div>
      <div id="songs" class="list"></div>
    </section>

    <section id="view-search" class="view hidden">
      <form id="search-form" class="searchbar">
        <input id="search-input" type="search" placeholder="搜索歌曲 / 歌手 / 专辑" autocomplete="off">
        <button type="submit">搜索</button>
      </form>
      <div id="search-results" class="list"></div>
    </section>
  </main>

  <div id="lyrics" class="lyrics hidden">
    <div class="lyrics-head"><span>歌词</span><button id="lyrics-close" class="ghost">收起</button></div>
    <div id="lyrics-body" class="lyrics-body"></div>
  </div>

  <footer class="player">
    <img id="np-cover" class="np-cover" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
    <div class="np-meta">
      <div id="np-title" class="np-title">未在播放</div>
      <div id="np-artist" class="np-artist"></div>
    </div>
    <div class="controls">
      <button id="btn-prev" title="上一首">⏮</button>
      <button id="btn-play" title="播放/暂停">▶</button>
      <button id="btn-next" title="下一首">⏭</button>
      <button id="btn-lyrics" title="歌词">词</button>
    </div>
    <div class="progress">
      <span id="t-cur">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1">
      <span id="t-dur">0:00</span>
    </div>
  </footer>

  <audio id="au" preload="metadata"></audio>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
